# Example scheduled Azure DevOps YAML pipeline for blueprint-drift.
# Stores snapshots and IRAP evidence packs as pipeline artefacts and creates an
# Azure Boards work item when configuration drift is detected.
#
# Configure a Variable Group named "blueprint-drift-secrets" linked to Azure
# Key Vault containing:
#   BLUEPRINT_TENANT_ID   - Target Microsoft Entra tenant GUID
#   BLUEPRINT_CLIENT_ID   - Read-only Entra app registration client GUID
#   BLUEPRINT_CERT_PEM    - Public X.509 certificate in PEM format
#   BLUEPRINT_KEY_PEM     - Matching RSA private key in PEM format

trigger: none
pr: none

schedules:
  - cron: "0 20 * * *"
    displayName: Daily ASD Blueprint drift check (06:00 AEST)
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: blueprint-drift-secrets
  - name: SNAPSHOT_DIR
    value: $(Build.ArtifactStagingDirectory)/snapshots
  - name: EVIDENCE_DIR
    value: $(Build.ArtifactStagingDirectory)/evidence-pack
  - name: PREV_SNAPSHOT_DIR
    value: $(Agent.TempDirectory)/previous-snapshots

steps:
  - checkout: self

  - task: GoTool@0
    displayName: Install Go 1.24
    inputs:
      version: "1.24"

  - script: |
      CGO_ENABLED=0 go build -o bin/blueprint-drift ./cmd/blueprint-drift
    displayName: Build blueprint-drift binary

  - task: DownloadPipelineArtifact@2
    displayName: Download previous snapshot artefact
    continueOnError: true
    inputs:
      buildType: specific
      project: $(System.TeamProjectId)
      definition: $(System.DefinitionId)
      buildVersionToDownload: latestFromBranch
      branchName: refs/heads/main
      artifactName: blueprint-drift-snapshots
      targetPath: $(PREV_SNAPSHOT_DIR)

  - script: |
      set -euo pipefail
      umask 077
      printf '%s\n' "$CERT_PEM" > "$(Agent.TempDirectory)/app-cert.pem"
      printf '%s\n' "$KEY_PEM" > "$(Agent.TempDirectory)/app-key.pem"

      mkdir -p "$(SNAPSHOT_DIR)" "$(EVIDENCE_DIR)"
      ./bin/blueprint-drift scan \
        --blueprint blueprint/settings \
        --backend direct \
        --tenant-id "${TENANT_ID:-00000000-0000-0000-0000-000000000000}" \
        --client-id "${CLIENT_ID:-11111111-1111-1111-1111-111111111111}" \
        --cert "$(Agent.TempDirectory)/app-cert.pem" \
        --key "$(Agent.TempDirectory)/app-key.pem" \
        --snapshot-dir "$(SNAPSHOT_DIR)" \
        --out "$(EVIDENCE_DIR)"
    displayName: Run read-only Blueprint drift scan
    env:
      TENANT_ID: $(BLUEPRINT_TENANT_ID)
      CLIENT_ID: $(BLUEPRINT_CLIENT_ID)
      CERT_PEM: $(BLUEPRINT_CERT_PEM)
      KEY_PEM: $(BLUEPRINT_KEY_PEM)

  - script: |
      set -u
      PREV_FILE=$(ls -1t "$(PREV_SNAPSHOT_DIR)"/run-*.json 2>/dev/null | head -n 1 || true)
      CURR_FILE=$(ls -1t "$(SNAPSHOT_DIR)"/run-*.json 2>/dev/null | head -n 1 || true)
      if [ -z "$PREV_FILE" ] || [ -z "$CURR_FILE" ]; then
        echo "No previous snapshot available for diff."
        echo "##vso[task.setvariable variable=DRIFT_DETECTED]false"
        exit 0
      fi

      set +e
      ./bin/blueprint-drift diff \
        --from "$PREV_FILE" \
        --to "$CURR_FILE" \
        --format markdown \
        --out "$(Build.ArtifactStagingDirectory)/drift-report.md" \
        --fail-on-drift
      STATUS=$?
      set -e

      if [ "$STATUS" -eq 3 ]; then
        echo "##vso[task.setvariable variable=DRIFT_DETECTED]true"
      elif [ "$STATUS" -eq 0 ]; then
        echo "##vso[task.setvariable variable=DRIFT_DETECTED]false"
      else
        exit "$STATUS"
      fi
    displayName: Compare against previous snapshot

  - script: rm -f "$(Agent.TempDirectory)/app-cert.pem" "$(Agent.TempDirectory)/app-key.pem"
    displayName: Clean up temporary private key material
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: Publish snapshot artefact
    condition: always()
    inputs:
      targetPath: $(SNAPSHOT_DIR)
      artifact: blueprint-drift-snapshots

  - task: PublishPipelineArtifact@1
    displayName: Publish IRAP evidence pack artefact
    condition: always()
    inputs:
      targetPath: $(EVIDENCE_DIR)
      artifact: irap-evidence-pack-$(Build.BuildId)

  - script: |
      set -euo pipefail
      az extension add --name azure-devops --yes
      BODY=$(cat "$(Build.ArtifactStagingDirectory)/drift-report.md")
      az boards work-item create \
        --org "$(System.TeamFoundationCollectionUri)" \
        --project "$(System.TeamProject)" \
        --type "Issue" \
        --title "Blueprint configuration drift detected ($(date -u +%Y-%m-%d))" \
        --description "$BODY"
    displayName: Create Azure Boards work item on drift
    condition: eq(variables['DRIFT_DETECTED'], 'true')
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
