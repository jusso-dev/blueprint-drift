schema_version: "1.0"
blueprint_version: "v1.4.0"
domain: "entra-id"
settings:
  - id: "ENTRA-PROP-001"
    section: "Entra ID / Identity properties"
    title: "Security defaults disabled in favour of Conditional Access"
    description: >-
      Security defaults must be disabled so that granular Blueprint Conditional
      Access policies can be enforced across the tenant.
    severity: "high"
    expected:
      operator: "equals"
      path: "isEnabled"
      value: false
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/policies/identitySecurityDefaultsEnforcementPolicy"
      permissions:
        - "Policy.Read.All"
      junction_operation: "graph.policies.identity_security_defaults_enforcement_policy.get"
    ism_controls:
      - "ISM-1507"
      - "ISM-1679"
    essential_eight:
      - "Multi-factor authentication"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/identity-properties/"
      - "https://learn.microsoft.com/en-us/graph/api/identitysecuritydefaultsenforcementpolicy-get?view=graph-rest-1.0"

  - id: "ENTRA-PROP-002"
    section: "Entra ID / Identity properties"
    title: "Tenant country and data location set to Australia"
    description: >-
      The Microsoft Entra ID organisation country code must be set to AU
      (Australia) to align with Australian data residency requirements.
    severity: "high"
    expected:
      operator: "policy_exists"
      rule: "entra_org_country_au"
      value: "AU"
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/organization"
      permissions:
        - "Organization.Read.All"
      junction_operation: "graph.organization.list"
    ism_controls:
      - "ISM-1577"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/identity-properties/"
      - "https://learn.microsoft.com/en-us/graph/api/organization-list?view=graph-rest-1.0"

  - id: "ENTRA-USER-001"
    section: "Entra ID / User settings"
    title: "Non-admin users cannot register applications"
    description: >-
      Default user role permissions must prevent non-admin users from
      registering new applications in Entra ID.
    severity: "high"
    expected:
      operator: "equals"
      path: "defaultUserRolePermissions.allowedToCreateApps"
      value: false
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/policies/authorizationPolicy"
      permissions:
        - "Policy.Read.All"
      junction_operation: "graph.policies.authorization_policy.get"
    ism_controls:
      - "ISM-1507"
    essential_eight:
      - "Restrict administrative privileges"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/users/user-settings/"
      - "https://learn.microsoft.com/en-us/graph/api/authorizationpolicy-get?view=graph-rest-1.0"

  - id: "ENTRA-USER-002"
    section: "Entra ID / User settings"
    title: "Non-admin users cannot create tenants"
    description: >-
      Default user role permissions must prevent non-admin users from creating
      unmanaged Entra tenants.
    severity: "medium"
    expected:
      operator: "equals"
      path: "defaultUserRolePermissions.allowedToCreateTenants"
      value: false
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/policies/authorizationPolicy"
      permissions:
        - "Policy.Read.All"
      junction_operation: "graph.policies.authorization_policy.get"
    ism_controls:
