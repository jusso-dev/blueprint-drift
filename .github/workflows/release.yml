name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release artefacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests before release build
        run: go test -race ./...

      - name: Build cross-platform binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            OUT="dist/blueprint-drift-${GOOS}-${GOARCH}${EXT}"
            echo "Building ${OUT}..."
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" ./cmd/blueprint-drift
          done
          (cd dist && sha256sum blueprint-drift-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
