schema_version: "1.0"
blueprint_version: "v1.4.0"
domain: "entra-id"
settings:
  - id: "ENTRA-PROP-001"
    section: "Entra ID / Identity properties"
    title: "Security defaults disabled in favour of Conditional Access"
    description: >-
      Security defaults must be disabled so that granular Blueprint Conditional
      Access policies can be enforced across the tenant.
    severity: "high"
    expected:
      operator: "equals"
      path: "isEnabled"
      value: false
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/policies/identitySecurityDefaultsEnforcementPolicy"
      permissions:
        - "Policy.Read.All"
      junction_operation: "graph.policies.identity_security_defaults_enforcement_policy.get"
    ism_controls:
      - "ISM-1507"
      - "ISM-1679"
    essential_eight:
      - "Multi-factor authentication"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/identity-properties/"
      - "https://learn.microsoft.com/en-us/graph/api/identitysecuritydefaultsenforcementpolicy-get?view=graph-rest-1.0"

  - id: "ENTRA-CA-002"
    section: "Entra ID / Conditional Access / Policies"
    title: "Block legacy authentication"
    description: >-
      An enabled Conditional Access policy must target all users and all cloud
      applications and block legacy authentication client types
      (exchangeActiveSync and other).
    severity: "critical"
    expected:
      operator: "policy_exists"
      rule: "ca_block_legacy_auth"
      value: true
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/identity/conditionalAccess/policies"
      permissions:
        - "Policy.Read.All"
      junction_operation: "graph.identity.conditional_access.policies.list"
    ism_controls:
      - "ISM-1507"
      - "ISM-1680"
    essential_eight:
      - "Multi-factor authentication"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/protection/conditional-access/policies/block-access-via-legacy-auth/"
      - "https://learn.microsoft.com/en-us/graph/api/conditionalaccessroot-list-policies?view=graph-rest-1.0"

  - id: "ENTRA-BG-001"
    section: "Entra ID / Users / Break-glass accounts"
    title: "Emergency access account operational governance"
    description: >-
      Two cloud-only emergency access (break-glass) accounts must be maintained,
      excluded from Conditional Access policies, monitored with alerting and
      tested periodically.
    severity: "high"
    expected:
      operator: "manual"
      value: "Two cloud-only break-glass accounts verified with alerting and periodic testing"
    api_source:
      kind: "manual"
      manual_reason: >-
        Operational credential storage, physical vaulting, alerting rules and
        periodic break-glass testing records cannot be verified solely through
        Microsoft Graph.
      manual_guidance: >-
        Confirm two cloud-only Global Administrator emergency accounts exist,
        are excluded from Conditional Access policies, have sign-in alert rules
        configured in Sentinel or Azure Monitor, and have current test logs.
    ism_controls:
      - "ISM-0445"
      - "ISM-1175"
    essential_eight:
      - "Restrict administrative privileges"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/users/break-glass-accounts/"
      - "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access"
