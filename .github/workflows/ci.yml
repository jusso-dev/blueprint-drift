name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-style:
    name: Lint, schema and style check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted with gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Validate JSON Schema and Blueprint YAML settings
        run: |
          python3 -m json.tool blueprint/schema/settings.schema.json > /dev/null
          go run ./cmd/blueprint-drift validate --blueprint blueprint/settings

      - name: Run style and hygiene check
        run: python3 scripts/style-check.py

      - name: Verify container image build
        run: |
          docker build -t blueprint-drift:ci-test .
          docker run --rm blueprint-drift:ci-test version
          docker run --rm blueprint-drift:ci-test validate --blueprint /etc/blueprint-drift/settings

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run unit tests (Unix with race detector)
        if: runner.os != 'Windows'
        run: go test -race -v ./...

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v ./...

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
        run: go build -o blueprint-drift${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/blueprint-drift

      - name: Smoke test binary
        shell: bash
        run: |
          ./blueprint-drift${{ runner.os == 'Windows' && '.exe' || '' }} version
          ./blueprint-drift${{ runner.os == 'Windows' && '.exe' || '' }} validate --blueprint blueprint/settings
