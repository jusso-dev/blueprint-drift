      - "https://learn.microsoft.com/en-us/graph/api/intune-deviceconfig-devicecompliancepolicy-list?view=graph-rest-1.0"

  - id: "INTUNE-COMP-006"
    section: "Intune / Devices / Compliance policies / iOS and iPadOS"
    title: "iOS/iPadOS compliance policy blocks jailbroken devices and requires passcode"
    description: >-
      An iOS/iPadOS compliance policy must block jailbroken devices and require
      a passcode of at least 6 characters.
    severity: "high"
    expected:
      operator: "policy_exists"
      rule: "intune_ios_compliance_baseline"
      value: true
    api_source:
      kind: "graph"
      version: "v1.0"
