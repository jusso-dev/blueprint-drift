  - id: "INTUNE-APP-001"
    section: "Intune / Apps / App protection policies / iOS"
    title: "iOS managed app protection policy enforces PIN and blocks unmanaged outbound data transfer"
    description: >-
      An iOS managed app protection policy must require a PIN and restrict
      outbound data transfers to managed applications.
    severity: "high"
    expected:
      operator: "policy_exists"
      rule: "intune_app_ios_protection"
      value: true
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/deviceAppManagement/iosManagedAppProtections"
      permissions:
        - "DeviceManagementApps.Read.All"
      junction_operation: "graph.device_app_management.ios_managed_app_protections.list"
    ism_controls:
      - "ISM-0869"
      - "ISM-1084"
    references:
      - "https://blueprint.asd.gov.au/configuration/intune/apps/by-platform/ios-ipados/"
      - "https://learn.microsoft.com/en-us/graph/api/intune-mam-iosmanagedappprotection-list?view=graph-rest-1.0"

