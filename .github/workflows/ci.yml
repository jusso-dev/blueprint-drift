name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run unit tests
        run: go test -v ./...

      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: go build -o blueprint-drift${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/blueprint-drift

      - name: Smoke test binary
        shell: bash
        run: ./blueprint-drift${{ runner.os == 'Windows' && '.exe' || '' }} version
