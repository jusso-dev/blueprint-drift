  - id: "ENTRA-BG-001"
    section: "Entra ID / Users / Break-glass accounts"
    title: "Emergency access account operational governance"
    description: >-
      Two cloud-only emergency access (break-glass) accounts must be maintained,
      excluded from Conditional Access policies, monitored with alerting and
      tested periodically.
    severity: "high"
    expected:
      operator: "manual"
      value: "Two cloud-only break-glass accounts verified with alerting and periodic testing"
    api_source:
      kind: "manual"
      manual_reason: >-
        Operational credential storage, physical vaulting, alerting rules and
        periodic break-glass testing records cannot be verified solely through
        Microsoft Graph.
      manual_guidance: >-
        Confirm two cloud-only Global Administrator emergency accounts exist,
        are excluded from Conditional Access policies, have sign-in alert rules
        configured in Sentinel or Azure Monitor, and have current test logs.
    ism_controls:
      - "ISM-0445"
      - "ISM-1175"
    essential_eight:
      - "Restrict administrative privileges"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/users/break-glass-accounts/"
      - "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access"

  - id: "ENTRA-SSPR-001"
    section: "Entra ID / Protection / Password reset"
    title: "Self-service password reset notifications and customisation"
    description: >-
      Self-service password reset (SSPR) notifications, administrator alerts and
      registration customisation must align with the Blueprint baseline.
    severity: "low"
    expected:
      operator: "manual"
      value: "SSPR notifications and admin alerts verified in Microsoft Entra admin center"
    api_source:
      kind: "manual"
      manual_reason: >-
        Microsoft Entra self-service password reset portal notification and
        customisation settings have no full GA read-only Microsoft Graph API.
      manual_guidance: >-
        Inspect Entra admin center -> Protection -> Password reset (Properties,
        Authentication methods, Registration and Notifications) and record
        evidence screenshots for the IRAP assessor.
    ism_controls:
      - "ISM-0421"
    references:
      - "https://blueprint.asd.gov.au/configuration/entra-id/protection/password-reset/notifications/"
      - "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks"
