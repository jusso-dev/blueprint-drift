  - id: "INTUNE-SCR-001"
    section: "Intune / Devices / Scripts"
    title: "ASD Windows registry hardening remediation scripts verified"
    description: >-
      Intune platform and remediation scripts covering SMB signing, NTLM
      restrictions, OLE activation blocking and Kerberos hardening must be
      reviewed for script integrity and endpoint execution status.
    severity: "medium"
    expected:
      operator: "manual"
      value: "All Blueprint Windows hardening scripts deployed with successful endpoint run status"
    api_source:
      kind: "manual"
      manual_reason: >-
        Verifying exact PowerShell script contents and endpoint execution
        telemetry requires manual inspection beyond simple policy presence.
      manual_guidance: >-
        Review Intune -> Devices -> Scripts and remediations against the
        Blueprint scripts list and confirm execution success rates across
        managed Windows devices.
    ism_controls:
      - "ISM-1409"
    references:
      - "https://blueprint.asd.gov.au/configuration/intune/devices/scripts/"
      - "https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension"

  - id: "INTUNE-WDAC-001"
    section: "Intune / Endpoint security / Application control"
    title: "Application control (WDAC / AppLocker) enforced per Essential Eight"
    description: >-
      Application control policies (Windows Defender Application Control or
      AppLocker) must be enforced on managed workstations to block unapproved
      executables, scripts and installers.
    severity: "critical"
    expected:
      operator: "manual"
      value: "Enforced WDAC/AppLocker allow-list policy verified with CodeIntegrity event telemetry"
    api_source:
      kind: "manual"
      manual_reason: >-
        Verifying custom WDAC XML allow-list rules and confirming enforcement
        mode (non-audit) across managed endpoints requires manual policy XML and
        event log review.
      manual_guidance: >-
        Export the active WDAC/AppLocker policy XML from Intune, confirm
        Enabled:Audit Mode is removed for enforced groups, and verify
        Microsoft-Windows-CodeIntegrity/Operational event logs.
    ism_controls:
      - "ISM-0843"
      - "ISM-1490"
    essential_eight:
      - "Application control"
    references:
      - "https://blueprint.asd.gov.au/configuration/intune/"
      - "https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/appcontrol"
