schema_version: "1.0"
blueprint_version: "v1.4.0"
domain: "intune"
settings:
  - id: "INTUNE-COMP-001"
    section: "Intune / Devices / Compliance policy settings"
    title: "Mark devices with no compliance policy assigned as not compliant"
    description: >-
      Intune tenant compliance policy settings must default devices without an
      assigned compliance policy to Not compliant (secureByDefault: true).
    severity: "high"
    expected:
      operator: "equals"
      path: "secureByDefault"
      value: true
    api_source:
      kind: "graph"
      version: "beta"
      method: "GET"
      endpoint: "/deviceManagement/settings"
      permissions:
        - "DeviceManagementConfiguration.Read.All"
    ism_controls:
      - "ISM-1546"
      - "ISM-1507"
    references:
      - "https://blueprint.asd.gov.au/configuration/intune/devices/compliance-policies/compliance-policy-settings/"
      - "https://learn.microsoft.com/en-us/graph/api/intune-shared-devicemanagementsettings-get?view=graph-rest-beta"

  - id: "INTUNE-COMP-002"
    section: "Intune / Devices / Compliance policy settings"
    title: "Compliance status validity period is 30 days or fewer"
    description: >-
      Devices that have not checked in within 30 days must be marked as non-compliant.
    severity: "medium"
    expected:
      operator: "lte"
      path: "deviceComplianceCheckinThresholdDays"
      value: 30
    api_source:
      kind: "graph"
      version: "beta"
      method: "GET"
      endpoint: "/deviceManagement/settings"
      permissions:
        - "DeviceManagementConfiguration.Read.All"
    ism_controls:
      - "ISM-1546"
    references:
      - "https://blueprint.asd.gov.au/configuration/intune/devices/compliance-policies/compliance-policy-settings/"
      - "https://learn.microsoft.com/en-us/graph/api/intune-shared-devicemanagementsettings-get?view=graph-rest-beta"

  - id: "INTUNE-COMP-003"
    section: "Intune / Devices / Compliance policies / Windows"
    title: "Windows compliance policy requires BitLocker, Secure Boot and Code Integrity"
    description: >-
      At least one Windows 10/11 compliance policy must enforce BitLocker disk
      encryption, Secure Boot and Code Integrity.
    severity: "critical"
    expected:
      operator: "policy_exists"
      rule: "intune_win_compliance_hardware"
      value: true
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/deviceManagement/deviceCompliancePolicies"
      permissions:
        - "DeviceManagementConfiguration.Read.All"
      junction_operation: "graph.device_management.device_compliance_policies.list"
    ism_controls:
      - "ISM-0459"
      - "ISM-1477"
    essential_eight:
      - "Patch operating systems"
    references:
      - "https://blueprint.asd.gov.au/configuration/intune/devices/compliance-policies/policies/windows-10-11-compliance-policy/"
      - "https://learn.microsoft.com/en-us/graph/api/intune-deviceconfig-devicecompliancepolicy-list?view=graph-rest-1.0"

  - id: "INTUNE-COMP-004"
    section: "Intune / Devices / Compliance policies / Windows"
    title: "Windows compliance policy requires Defender antimalware, RTP and firewall"
    description: >-
      At least one Windows 10/11 compliance policy must require Microsoft
      Defender Antivirus, real-time protection and host firewall enabled.
    severity: "critical"
    expected:
      operator: "policy_exists"
      rule: "intune_win_compliance_defender"
      value: true
    api_source:
      kind: "graph"
      version: "v1.0"
      method: "GET"
      endpoint: "/deviceManagement/deviceCompliancePolicies"
      permissions:
        - "DeviceManagementConfiguration.Read.All"
      junction_operation: "graph.device_management.device_compliance_policies.list"
    ism_controls:
      - "ISM-1416"
      - "ISM-1546"
    references:
      - "https://blueprint.asd.gov.au/configuration/intune/devices/compliance-policies/policies/windows-10-11-compliance-policy/"
      - "https://learn.microsoft.com/en-us/graph/api/intune-deviceconfig-devicecompliancepolicy-list?view=graph-rest-1.0"

  - id: "INTUNE-COMP-005"
    section: "Intune / Devices / Compliance policies / Windows"
    title: "Windows compliance policy enforces Defender for Endpoint risk score"
    description: >-
      Windows compliance policy must integrate with Microsoft Defender for
      Endpoint threat protection and require a machine risk score of low or
      secured.
    severity: "high"
    expected:
